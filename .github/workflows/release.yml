name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic release tag, for example v1.0.2"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required GitHub Actions secret: $value" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lightnovel-release.jks"

      - name: Test, lint, and build signed APK
        shell: bash
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lightnovel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon -Pkotlin.incremental=false

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          apk="LightNovel-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightNovel-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          APK_FILE: ${{ steps.package.outputs.apk }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "$APK_FILE" "$APK_FILE.sha256" --clobber
          else
            version="${VERSION_TAG#v}"
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { capture = 1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > release-notes.md
            if [[ -s release-notes.md ]]; then
              gh release create "$VERSION_TAG" "$APK_FILE" "$APK_FILE.sha256" \
                --target "$GITHUB_SHA" \
                --title "LightNovel $version" \
                --notes-file release-notes.md
            else
              gh release create "$VERSION_TAG" "$APK_FILE" "$APK_FILE.sha256" \
                --target "$GITHUB_SHA" \
                --title "LightNovel $version" \
                --generate-notes
            fi
          fi
